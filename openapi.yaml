openapi: 3.0.0
info:
  title: SubTrackr API
  version: 1.0.0
  description: Subscription management API
servers:
  - url: http://localhost:3001
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

  /plans:
    post:
      summary: Create a new plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created

  /plans/{id}:
    get:
      summary: Get plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    patch:
      summary: Update plan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
    delete:
      summary: Deactivate plan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /graphql:
    post:
      summary: GraphQL endpoint
      responses:
        '200':
          description: OK

  /metrics/plan-cache:
    get:
      summary: Prometheus metrics for plan cache
      responses:
        '200':
          description: OK

  /rate-limits/analytics:
    get:
      summary: Rate limit analytics
      parameters:
        - in: query
          name: tier
          schema:
            type: string
      responses:
        '200':
          description: OK

  /rate-limits/status:
    get:
      summary: Rate limit status
      parameters:
        - in: query
          name: apiKey
          required: true
          schema:
            type: string
        - in: query
          name: tier
          schema:
            type: string
      responses:
        '200':
          description: OK

  /rate-limits/bypass:
    post:
      summary: Manage bypass list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK

  /rate-limits/config:
    post:
      summary: Set custom rate limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK