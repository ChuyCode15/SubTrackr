type: object
properties:
  id:
    type: string
    example: "theme_dark"
  merchantId:
    type: string
    example: "merchant_123"
  name:
    type: string
    example: "Dark Theme"
  config:
    type: object
    example:
      primaryColor: "#1a1a2e"
      secondaryColor: "#16213e"
      fontFamily: "Inter"
  isActive:
    type: boolean
    example: true
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
