      tags:
      - Plans
    patch:
      operationId: updatePlan
      parameters:
      - description: Plan identifier
        example: plan_premium
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdateInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createPlan_201_response"
          description: Plan updated successfully
        "400":
          content:
            application/json:
              example:
                success: false
                error:
                  message: "Missing required field: name"
                status: 400
                requestId: req_abc123
              schema:
