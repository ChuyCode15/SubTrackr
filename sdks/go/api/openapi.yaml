  /public/{path}:
    get:
      operationId: getPublicConfig
      parameters:
      - description: "Configuration path (e.g., app/version)"
        example: app/version
        in: path
        name: path
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                single:
                  value:
                    success: true
                    data:
                      key: app/version
                      value:
                        minSupported: 1.0.0
                        latest: 1.0.0
                list:
                  value:
                    success: true
                    data:
                    - key: app/version
                      value:
                        minSupported: 1.0.0
                        latest: 1.0.0
                    - key: app/support
                      value:
