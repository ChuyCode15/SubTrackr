components:
  parameters:
    PlanId:
      description: Plan identifier
      example: plan_premium
      in: path
      name: id
      required: true
      schema:
        type: string
    ThemeId:
      description: Theme identifier
      example: theme_dark
      in: path
      name: id
      required: true
      schema:
        type: string
    MerchantId:
      description: Merchant identifier for multi-tenant isolation
      example: merchant_123
      in: header
      name: x-merchant-id
      schema:
        type: string
    ApiKey:
      description: API key for rate limit status check
      example: sk_live_abc123
      in: query
      name: apiKey
      required: true
      schema:
        type: string
    Tier:
      description: Subscription tier filter
      example: PREMIUM
      in: query
      name: tier
      schema:
        enum:
        - FREE
        - BASIC
        - PREMIUM
        - ENTERPRISE
        type: string
  responses:
    NotFound:
      content:
        application/json:
          example:
            success: false
            error:
              message: Plan not found
            status: 404
            requestId: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Resource not found
    BadRequest:
      content:
        application/json:
          example:
            success: false
            error:
              message: "Missing required field: name"
            status: 400
            requestId: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Bad request
    InternalError:
      content:
        application/json:
          example:
            success: false
            error:
              message: Internal server error
            status: 500
            requestId: req_abc123
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error
  schemas:
    Plan:
      example:
        id: plan_premium
        name: Premium Plan
        price: 29.99
        currency: USD
        billingCycle: monthly
        features:
        - Unlimited subscriptions
        - Advanced analytics
        isActive: true
        createdAt: 2000-01-23T04:56:07.000+00:00
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          example: plan_premium
          type: string
        name:
          example: Premium Plan
          type: string
        price:
          example: 29.99
          type: number
        currency:
          example: USD
          type: string
        billingCycle:
          enum:
          - monthly
          - yearly
          example: monthly
          type: string
        features:
          example:
          - Unlimited subscriptions
          - Advanced analytics
          items:
            type: string
          type: array
        isActive:
          example: true
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    PlanInput:
      example:
        name: Premium Plan
        price: 29.99
        currency: USD
        billingCycle: monthly
