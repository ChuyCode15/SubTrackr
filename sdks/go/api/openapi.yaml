openapi: 3.0.0
info:
  contact:
    email: support@subtrackr.com
    name: SubTrackr Team
  description: Subscription management platform API
  title: SubTrackr API
  version: 1.0.0
servers:
- description: Production
  url: https://api.subtrackr.com/v1
- description: Local Development
  url: http://localhost:3001
security:
- ApiKeyAuth: []
tags:
- description: Subscription plan management
  name: Plans
- description: Pricing tiers and discounts
  name: Pricing
- description: Feature flags and gating
  name: Features
- description: Merchant theme customization
  name: Themes
- description: Public configuration endpoints
  name: Public
- description: Service health checks
  name: Health
- description: GraphQL API endpoint
  name: GraphQL
- description: Prometheus metrics
  name: Metrics
- description: Rate limit management
  name: Rate Limits
- description: Cache management
  name: Cache
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHealth_200_response"
          description: Service healthy
        "500":
          content:
            application/json:
              example:
                success: false
                error:
                  message: Internal server error
                status: 500
                requestId: req_abc123
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security: []
      summary: Health check
      tags:
      - Health
  /plans:
    get:
      operationId: listPlans
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listPlans_200_response"
          description: List of plans
        "500":
          content:
            application/json:
              example:
